<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University Study HQ</title><style>:root{--bg:#f7f5f1;--card:#fff;--ink:#292724;--muted:#7b7771;--line:#e9e4dc;--p:#9180b7;--b:#799dc5;--g:#789681;--t:#ad8964;--r:#b97886}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:end;padding:8px 2px 18px;border-bottom:1px solid var(--line)}h1,h2,.code{font-family:Georgia,serif}.top h1{font-size:30px;margin:0;font-weight:500}.top p{margin:6px 0 0;color:var(--muted)}.date{text-align:right;color:var(--muted)}.courses{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.course,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.course{padding:17px;min-height:105px}.code{font-size:19px}.course small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}.grade{margin-top:13px;font-size:11px}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.card{padding:18px}h2{font-weight:500;font-size:21px;margin:0 0 14px}.row{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.row:last-child{border:0}.main{font-weight:600;font-size:12px}.sub{color:var(--muted);font-size:11px;margin-top:4px}.pill{font-size:10px;padding:5px 8px;border-radius:8px;background:#f0ede8;white-space:nowrap;height:max-content}.study{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.empty{color:var(--muted);padding:16px 0}.error{padding:16px;background:#fff1ef;border:1px solid #efd6d1;border-radius:12px;color:#8d4d43}.footer{padding:18px 2px;color:var(--muted);font-size:10px}.bar{height:6px;background:#eeeae4;border-radius:9px;margin-top:9px;overflow:hidden}.fill{height:100%;background:var(--g);border-radius:9px}@media(max-width:850px){.courses{grid-template-columns:1fr 1fr}.grid,.study{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:start}.date{font-size:11px}}</style></head><body><main class="wrap"><header class="top"><div><h1>University Study HQ</h1><p>Your classes, deadlines and study plan — live from Notion.</p></div><div class="date" id="date"></div></header><div id="app"><div class="empty">Loading your Notion study system…</div></div><div class="footer" id="updated"></div></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const now=new Date();$('#date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function courseFor(ids,map){return ids?.length?map[ids[0]]:null}function when(d){if(!d?.start)return null;return new Date(d.start)}function sameDay(a,b){return a&&a.toDateString()===b.toDateString()}function fmtTime(d){return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function daysUntil(d){return Math.ceil((d-now)/86400000)}
async function load(){try{const r=await fetch('/api/study-hq');const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load');render(d)}catch(e){$('#app').innerHTML='<div class="error"><b>Could not load Notion data.</b><div class="sub">'+esc(e.message)+'</div></div>'}}
function render(d){const cmap=Object.fromEntries(d.courses.map(c=>[c.id,c]));const active=d.courses.filter(c=>c.active);const upcoming=d.tasks.filter(t=>t.status!=='Done'&&when(t.due)&&when(t.due)>=new Date(now.getFullYear(),now.getMonth(),now.getDate())).sort((a,b)=>when(a.due)-when(b.due));const todayClasses=d.classes.filter(x=>sameDay(when(x.when),now)).sort((a,b)=>when(a.when)-when(b.when));const todayStudy=d.sessions.filter(x=>sameDay(when(x.when),now)&&!x.completed).sort((a,b)=>when(a.when)-when(b.when));const planned=d.sessions.filter(x=>!x.completed&&when(x.when)&&when(x.when)>=new Date(now.getFullYear(),now.getMonth(),now.getDate())).sort((a,b)=>when(a.when)-when(b.when));const exams=upcoming.filter(x=>['Midterm','Final Exam','Quiz'].includes(x.type));
let courses='<div class="courses">'+active.map((c,i)=>`<div class="course"><div class="code">${esc(c.code||c.name)}</div><small>${esc(c.name.replace(/^.*?—\s*/,''))}</small><div class="grade">${c.currentGrade!=null?'Current grade '+c.currentGrade+'%':'Active'}${c.targetGrade!=null?' · Target '+c.targetGrade+'%':''}</div>${c.currentGrade!=null?`<div class="bar"><div class="fill" style="width:${Math.min(100,c.currentGrade)}%"></div></div>`:''}</div>`).join('')+'</div>';
const today=[...todayClasses.map(x=>({time:when(x.when),name:x.name||x.type,sub:[courseFor(x.courseIds,cmap)?.code,x.location].filter(Boolean).join(' · ')})),...todayStudy.map(x=>({time:when(x.when),name:x.name||'Study Session',sub:[courseFor(x.courseIds,cmap)?.code,x.topic,x.plannedMinutes?x.plannedMinutes+' min':null].filter(Boolean).join(' · ')}))].sort((a,b)=>a.time-b.time);
let html=courses+'<div class="grid"><section class="card"><h2>Today</h2>'+(today.length?today.map(x=>`<div class="row"><div><div class="main">${esc(x.name)}</div><div class="sub">${esc(x.sub)}</div></div><span class="pill">${fmtTime(x.time)}</span></div>`).join(''):'<div class="empty">Nothing scheduled today.</div>')+'</section>';
html+='<section class="card"><h2>Upcoming Deadlines</h2>'+(upcoming.length?upcoming.slice(0,6).map(x=>{const c=courseFor(x.courseIds,cmap),dd=daysUntil(when(x.due));return`<div class="row"><div><div class="main">${esc(c?.code||'Course')} — ${esc(x.name)}</div><div class="sub">${esc(x.type)}${x.weight!=null?' · '+x.weight+'%':''}</div></div><span class="pill">${dd===0?'Today':dd+'d'}</span></div>`}).join(''):'<div class="empty">No upcoming deadlines yet.</div>')+'</section>';
html+='<section class="card"><h2>Exam Countdown</h2>'+(exams.length?exams.slice(0,6).map(x=>`<div class="row"><div><div class="main">${esc(courseFor(x.courseIds,cmap)?.code||'Course')} — ${esc(x.name)}</div><div class="sub">${when(x.due).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div></div><span class="pill">${daysUntil(when(x.due))} days</span></div>`).join(''):'<div class="empty">Add exam dates to Academic Tasks and they’ll appear here.</div>')+'</section></div>';
html+='<div class="study"><section class="card"><h2>Study Queue</h2>'+(planned.length?planned.slice(0,8).map(x=>`<div class="row"><div><div class="main">${esc(courseFor(x.courseIds,cmap)?.code||'Study')} — ${esc(x.topic||x.name)}</div><div class="sub">${esc(x.method)}${x.plannedMinutes?' · '+x.plannedMinutes+' min':''}</div></div><span class="pill">${when(x.when).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span></div>`).join(''):'<div class="empty">No study sessions planned yet.</div>')+'</section><section class="card"><h2>This Week</h2>'+d.classes.filter(x=>{const z=when(x.when);return z&&z>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&z<=new Date(now.getTime()+7*86400000)}).sort((a,b)=>when(a.when)-when(b.when)).slice(0,10).map(x=>`<div class="row"><div><div class="main">${esc(courseFor(x.courseIds,cmap)?.code||'Class')} — ${esc(x.type)}</div><div class="sub">${esc(x.location||x.topic)}</div></div><span class="pill">${when(x.when).toLocaleDateString(undefined,{weekday:'short'})} ${fmtTime(when(x.when))}</span></div>`).join('')+'</section></div>';$('#app').innerHTML=html;$('#updated').textContent='Synced from Notion · '+new Date(d.updatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
load();setInterval(load,120000);
</script></body></html>
